events {}

http {
    # Define o limite de requisições por endereço IP
    limit_req_zone $binary_remote_addr
        zone=limite_api:10m
        rate=1r/s;
    # Define o grupo de servidores back-end
    upstream meus_servidores {
        least_conn;
        server backend1:80;
        server backend2:80;
        server backend3:80;
    }

    server {
        # O Nginx vai escutar na porta 80
        listen 8080;
        #Código HTTP para requisições acima do limite
        limit_req_status 503;

        location / {
            #Aplica o Rate Limiting
            limit_req zone=limite_api;

            # Repassa a requisição para o grupo "meus_servidores"
            proxy_pass http://meus_servidores;

            # 1. Preserva o Host original digitado no navegador
            proxy_set_header Host $host;

            # 2. Passa o IP real do cliente diretamente
            proxy_set_header X-Real-IP $remote_addr;

            # 3. Mantém o histórico de IPs se houver mais proxies na cadeia
            # $proxy_add_x_forwarded_for anexa o IP do cliente ao cabeçalho existente
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # 4. Informa ao backend qual protocolo o usuário usou (http ou https)
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}